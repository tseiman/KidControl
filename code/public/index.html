<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="apple-mobile-web-app-title" content="KidControl">
  <title>KidControl</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.png" type="image/png" sizes="1254x1254">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <span class="eyebrow" data-i18n="app.eyebrow">HOME ACCESS</span>
      <h1>KidControl</h1>
    </div>
    <div class="header-links">
      <a href="/docs" data-i18n="nav.documentation">Documentation</a>
      <span id="version-tag" class="version-tag" data-version="__KIDCONTROL_VERSION__">Version __KIDCONTROL_VERSION__</span>
      <a class="copyright-link" href="https://github.com/tseiman/KidControl">© by Tseiman '26</a>
    </div>
  </header>
  <main>
    <p id="message" role="status" aria-live="polite"></p>

    <section id="login" class="panel login-panel">
      <h2 data-i18n="login.title">Sign in</h2>
      <p data-i18n="login.intro">Choose your profile and enter your four-digit PIN.</p>
      <form id="login-form">
        <fieldset class="profile-fieldset">
          <legend data-i18n="login.profile">Profile</legend>
          <div id="user-grid" class="user-grid" role="group" aria-label="Choose a profile" data-i18n-aria-label="login.chooseProfile"></div>
        </fieldset>
        <input id="user" type="hidden">
        <label><span data-i18n="login.pin">PIN</span><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label>
        <button id="login-submit" data-i18n="login.submit" disabled>Sign in</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="summary panel">
        <div class="summary-profile">
          <span id="summary-avatar" aria-hidden="true"></span>
          <strong id="summary-user-name">—</strong>
        </div>
        <div class="summary-time">
          <span class="eyebrow" data-i18n="dashboard.remaining">TIME REMAINING</span>
          <strong id="remaining">--:--:--</strong>
        </div>
        <button id="logout" class="secondary" data-i18n="dashboard.logout">Log out</button>
      </div>
      <div id="devices" class="devices"></div>
      <button id="stop" class="danger wide" data-i18n="dashboard.stop">Stop my session</button>

      <section id="own-usage-chart" class="panel usage-chart own-usage-chart" aria-labelledby="own-usage-chart-title" hidden>
        <div class="usage-chart-heading">
          <h2 id="own-usage-chart-title" data-i18n="usage.title">Usage · last 7 days</h2>
          <span id="own-usage-detail" class="usage-detail" aria-live="polite" aria-atomic="true">--</span>
        </div>
        <div class="usage-chart-body">
          <div class="usage-axis" aria-hidden="true">
            <span id="own-usage-axis-max">1 h</span>
            <span>0</span>
          </div>
          <div id="own-usage-bars" class="usage-bars"></div>
        </div>
      </section>

      <section id="admin" class="panel" hidden>
        <h2 data-i18n="admin.title">Superuser controls</h2>
        <form id="adjust">
          <div class="picker-field">
            <span id="target-label" class="field-label" data-i18n="admin.user">User</span>
            <div id="target-picker" class="user-picker">
              <button id="target-trigger" class="user-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="target-label target-trigger"></button>
              <div id="target-options" class="user-picker-options" role="listbox" aria-labelledby="target-label" hidden></div>
            </div>
            <input id="target" type="hidden">
          </div>
          <div class="time-pickers">
            <label><span data-i18n="admin.hours">Hours</span><select id="hours"></select></label>
            <label><span data-i18n="admin.minutes">Minutes</span><select id="minutes"></select></label>
          </div>
          <button id="adjust-submit" data-i18n="admin.setRemaining">Set remaining time</button>
        </form>
        <button id="restore" class="secondary wide" data-i18n="admin.restore">Restore network state</button>
        <section id="usage-chart" class="usage-chart" aria-labelledby="usage-chart-title" hidden>
          <div class="usage-chart-heading">
            <h3 id="usage-chart-title" data-i18n="usage.title">Usage · last 7 days</h3>
            <span id="usage-detail" class="usage-detail" aria-live="polite" aria-atomic="true">--</span>
          </div>
          <div class="usage-chart-body">
            <div class="usage-axis" aria-hidden="true">
              <span id="usage-axis-max">1 h</span>
              <span>0</span>
            </div>
            <div id="usage-bars" class="usage-bars"></div>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>

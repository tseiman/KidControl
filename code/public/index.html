<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>KidControl</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">HOME ACCESS</span>
      <h1>KidControl</h1>
    </div>
    <a href="/docs">Documentation</a>
  </header>
  <main>
    <p id="message" role="status" aria-live="polite"></p>

    <section id="login" class="panel login-panel">
      <h2>Sign in</h2>
      <p>Choose your profile and enter your four-digit PIN.</p>
      <form id="login-form">
        <fieldset class="profile-fieldset">
          <legend>Profile</legend>
          <div id="user-grid" class="user-grid" role="group" aria-label="Choose a profile"></div>
        </fieldset>
        <input id="user" type="hidden">
        <label>PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label>
        <button id="login-submit" disabled>Sign in</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="summary panel">
        <div>
          <span class="eyebrow">TIME REMAINING</span>
          <strong id="remaining">--:--:--</strong>
        </div>
        <button id="logout" class="secondary">Log out</button>
      </div>
      <div id="devices" class="devices"></div>
      <button id="stop" class="danger wide">Stop my session</button>

      <section id="admin" class="panel" hidden>
        <h2>Superuser controls</h2>
        <form id="adjust">
          <div class="picker-field">
            <span id="target-label" class="field-label">User</span>
            <div id="target-picker" class="user-picker">
              <button id="target-trigger" class="user-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="target-label target-trigger"></button>
              <div id="target-options" class="user-picker-options" role="listbox" aria-labelledby="target-label" hidden></div>
            </div>
            <input id="target" type="hidden">
          </div>
          <div class="time-pickers">
            <label>Hours<select id="hours"></select></label>
            <label>Minutes<select id="minutes"></select></label>
          </div>
          <button id="adjust-submit">Set remaining time</button>
        </form>
        <button id="restore" class="secondary wide">Restore KidControl state</button>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
